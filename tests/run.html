<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>함닷 규칙 테스트</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;line-height:1.6}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px;text-align:left}td{white-space:pre-wrap;overflow-wrap:anywhere}.fail{background:#ffe7e7}.known{background:#fff4ce}iframe{width:1px;height:1px;border:0;position:absolute;left:-10000px}
</style>
<h1>함닷 규칙 테스트</h1>
<p>로컬 서버나 공개 주소(https://osh2162-123.github.io/hamdot/tests/run.html)에서 여세요. 공개 주소는 배포된 버전을 검사합니다.</p>
<p>앱을 다른 탭에서 편집하지 않는 동안 실행해 주세요. A12 검사를 위해 iframe의 학교 식별어에 가상 값 ‘예시학교’를 지정합니다.</p>
<p id="status" role="status">페이지를 불러오는 중입니다.</p>
<table><thead><tr><th>상태</th><th>영역</th><th>예문</th><th>기대</th><th>실제</th><th>설명</th></tr></thead><tbody id="results"></tbody></table>
<iframe id="app" title="검증할 함닷 페이지"></iframe>
<script>
const status=document.getElementById("status");
const frame=document.getElementById("app");
function loadCases(){
  return new Promise((resolve,reject)=>{
    const request=new XMLHttpRequest();
    request.open("GET","cases.json");
    request.onload=()=>{try{if(request.status!==200)throw new Error("예문 파일을 읽지 못했습니다.");resolve(JSON.parse(request.responseText))}catch(error){reject(error)}};
    request.onerror=()=>reject(new Error("예문 파일을 읽지 못했습니다."));
    request.send();
  });
}
function snapshot(storage){return Object.fromEntries(Object.keys(storage).filter(k=>k.startsWith("setuk-")).map(k=>[k,storage.getItem(k)]))}
function restore(storage,values){Object.keys(storage).filter(k=>k.startsWith("setuk-")).forEach(k=>storage.removeItem(k));Object.entries(values).forEach(([k,v])=>storage.setItem(k,v))}
async function run(){
  let saved;
  try{
    if(location.protocol==="file:")throw new Error("로컬 서버나 공개 주소에서 여세요.");
    saved=[snapshot(localStorage),snapshot(sessionStorage)];
    const cases=await loadCases();
    await new Promise((resolve,reject)=>{
      frame.onload=resolve;frame.onerror=()=>reject(new Error("앱 페이지를 읽지 못했습니다."));frame.src="../index.html";
    });
    const app=frame.contentWindow;
    if(typeof app.scan!=="function"||typeof app.setArea!=="function")throw new Error("앱의 점검 함수를 읽지 못했습니다.");
    app.document.getElementById("blocked").value="예시학교";
    app.document.getElementById("orgs").value="";
    for(const id of ["club","hours","hope"])app.document.getElementById(id).value="";
    let passed=0,failed=0,known=0;
    for(const item of cases){
      app.setArea(item.mode);
      const actual=[...new Set(app.scan(item.text).map(f=>f.id))];
      const ok=item.expect.every(id=>actual.includes(id))&&item.not.every(id=>!actual.includes(id));
      let result;
      if(ok){passed++;result=item.known_fail?"통과 · known_fail 해제 검토":"통과"}
      else if(item.known_fail){known++;result="알려진 실패"}
      else{failed++;result="실패"}
      const row=document.createElement("tr");row.className=ok?"pass":item.known_fail?"known":"fail";
      for(const value of [result,item.mode,item.text,"필수 "+item.expect.join(", ")+" / 제외 "+item.not.join(", "),actual.join(", "),item.note]){
        const cell=document.createElement("td");cell.textContent=value;row.appendChild(cell);
      }
      document.getElementById("results").appendChild(row);
    }
    status.textContent=`전체 ${cases.length} · 통과 ${passed} · 실패 ${failed} · known_fail ${known}`;
    Object.assign(status.dataset,{total:cases.length,passed,failed,known});
  }catch(error){status.textContent=error.message;status.dataset.error="true"}
  finally{
    if(saved){try{restore(localStorage,saved[0]);restore(sessionStorage,saved[1])}catch(error){status.textContent+=" 저장 설정 복원 실패. "+error.message;status.dataset.error="true"}}
    status.dataset.complete="true";
  }
}
run();
</script>
</html>
