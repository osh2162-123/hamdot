<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>함닷 참고 자료</title>
<style>
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Regular.subset.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Medium.subset.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/Pretendard-SemiBold.subset.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/Pretendard-Bold.subset.woff2") format("woff2")}
:root{
  --paper:#f3f5f7; --sheet:#ffffff; --ink:#1e2329; --muted:#6b7480; --line:#e4e8ec; --soft:#eef1f4;
  --accent:#03c75a; --accent-fill:#00a050; --accent-text:#00873f; --accent-wash:#e7f8ef; --accent-ink:#ffffff;
  --err:#d93a2f; --warn:#a36200; --info:#2f63a8;
  --err-bg:rgba(217,58,47,.13); --warn-bg:rgba(230,160,20,.22); --info-bg:rgba(47,99,168,.12);
  --c1:#d93a2f; --c2:#00873f; --c3:#7b5cc4;
  --shadow:0 1px 2px rgba(20,30,40,.04),0 2px 8px rgba(20,30,40,.04);
  --f-sans:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  /* 글자 크기: 대주제일수록 크고 굵게 */
  --fs-1:24px; --fs-2:18px; --fs-3:15px; --fs-4:14px; --fs-5:12.5px; --fs-6:11.5px;
  --fw-1:700; --fw-2:700; --fw-3:600; --fw-4:400; --fw-5:400;
  --r-card:16px; --r-ctl:999px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111315; --sheet:#1a1d20; --ink:#e8ebee; --muted:#9aa3ac; --line:#2a2f34; --soft:#22262a;
  --accent:#03c75a; --accent-fill:#00a050; --accent-text:#45d98d; --accent-wash:rgba(3,199,90,.14); --accent-ink:#ffffff;
  --err:#ff7a6e; --warn:#e8b24f; --info:#8fb6e8;
  --err-bg:rgba(255,122,110,.2); --warn-bg:rgba(232,178,79,.22); --info-bg:rgba(143,182,232,.18);
  --c1:#ff7a6e; --c2:#45d98d; --c3:#b9a0ef;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111315; --sheet:#1a1d20; --ink:#e8ebee; --muted:#9aa3ac; --line:#2a2f34; --soft:#22262a;
  --accent:#03c75a; --accent-fill:#00a050; --accent-text:#45d98d; --accent-wash:rgba(3,199,90,.14); --accent-ink:#ffffff;
  --err:#ff7a6e; --warn:#e8b24f; --info:#8fb6e8;
  --err-bg:rgba(255,122,110,.2); --warn-bg:rgba(232,178,79,.22); --info-bg:rgba(143,182,232,.18);
  --c1:#ff7a6e; --c2:#45d98d; --c3:#b9a0ef;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-sans);font-size:var(--fs-4);line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.big,.stat b,.scale,.meta,.diag dd,.rank .n,.nums button,.findings .id{font-variant-numeric:tabular-nums}


.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:var(--r-ctl);padding:5px 13px;font-size:var(--fs-5);cursor:pointer;line-height:1.3}
.ghost:hover{border-color:var(--accent);color:var(--accent-text)}
.panel{min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:var(--fs-2);font-weight:var(--fw-2);margin:0;letter-spacing:-.02em}
.panel-head .sub{color:var(--muted);font-size:var(--fs-5)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:14px 18px}
.legend2{display:flex;gap:10px;flex-wrap:wrap;font-size:var(--fs-6);color:var(--muted)}
.legend2 span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.legend2 .l-empty::before{border-style:dashed}
.legend2 .l-ok::before{background:var(--soft)}
.legend2 .l-warn::before{background:var(--warn-bg);border-color:var(--warn)}
.legend2 .l-err::before{background:var(--err-bg);border-color:var(--err)}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--sheet)}
.filters select{padding:5px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--paper);font-size:var(--fs-5)}
.note{font-size:var(--fs-5);color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.cases{display:flex;flex-direction:column;gap:10px}
.case{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px;background:var(--sheet)}
.case:hover{border-color:var(--accent)}
.case-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.case-top strong{font-size:var(--fs-4);font-weight:600}
.case-top .meta{font-size:var(--fs-6);color:var(--muted)}
.case-top a{margin-left:auto;font-size:var(--fs-5);font-weight:600;color:var(--accent-text);text-decoration:none;white-space:nowrap}
.case-top a:hover{text-decoration:underline}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:var(--fs-6);padding:0 8px;border-radius:999px;background:var(--soft);color:var(--muted);line-height:20px}
.chip.subj{background:var(--accent-wash);color:var(--accent-text);font-weight:600}
.chip.judge{background:var(--warn-bg);color:var(--warn)}
.flow{font-size:var(--fs-5);color:var(--ink)}
.flow .arr{color:var(--muted);padding:0 3px}
.more{margin-top:10px}
.sec{display:grid;gap:8px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--soft)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0;font-size:var(--fs-3);font-weight:var(--fw-3)}
.sec p{margin:0;font-size:var(--fs-5);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-6);color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--f-sans);font-size:9px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:var(--fs-5)}
.rank li{display:flex;align-items:center;gap:6px}
.rank .w{width:5.5em;flex:none}
.rank .b{height:7px;border-radius:4px;background:var(--accent)}
.rank .n{font-size:var(--fs-6);color:var(--muted)}
.rank.alt .b{background:var(--warn)}
.colh{font-size:var(--fs-6);color:var(--muted);margin-bottom:4px;font-weight:600}
.steps{margin:0;padding-left:18px;font-size:var(--fs-5);display:grid;gap:4px}
.steps b{font-weight:600}
.cite{font-size:var(--fs-6);color:var(--muted)}
body{height:auto}main{max-width:1100px;margin:auto;padding:24px 16px;display:grid;gap:20px}.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-card)}.panel-body{overflow:visible}h1{font-size:var(--fs-1)}.panel-head h2{font-size:var(--fs-2);font-weight:var(--fw-2);margin:0}a{color:var(--accent-text)}@media(max-width:600px){.cols{grid-template-columns:1fr}}
</style>
</head>

/* ---------- 사례집 ---------- */
const FLAT=[];IDX.forEach(([y,d,s,id,ps])=>ps.forEach((p,i)=>FLAT.push({y,d,s,id,no:i+1,subj:p[0],len:p[1],b:p[2],tags:p[3],flow:p[4]})));
const SUBJS=["국어","영어","수학","사회","과학","정보","예체능","창체·행특","기타"];

$("fYear").innerHTML='<option value="">학년도 전체</option>'+YEARS.slice().reverse().map(v=>`<option value="${v}">${v}학년도</option>`).join("");
let shown=60;
const TAGS=["동기","방법","확장","도서","평가어","수치"];
function caseList(){
  const fs=$("fSubj").value,fy=$("fYear").value,ft=$("fTag").value;
  return FLAT.filter(c=>(!fs||c.subj===fs)&&(!fy||c.y==fy)&&(!ft||(ft[0]==="!"?!c.tags.includes(ft.slice(1)):c.tags.includes(ft))));
}
function renderCases(){
  const list=caseList();
  $("caseCount").textContent=list.length+"문단";
  $("cases").innerHTML=list.slice(0,shown).map(c=>{
    const tags=TAGS.filter(t=>c.tags.includes(t)).map(t=>`<span class="chip${t==="평가어"?" judge":""}">${t}</span>`).join("");
    const flow=c.flow?c.flow.split(">").map(esc).join('<span class="arr">→</span>'):"";
    return `<article class="case"><div class="case-top"><strong>${c.y} · ${esc(c.d)} ${c.s}</strong><span class="meta">문단 ${c.no} · ${c.len}자 · ${c.b.toLocaleString()}B</span><a href="${AR}${c.id}" target="_blank" rel="noopener">원문 ↗</a></div><div class="chips"><span class="chip subj">${c.subj}</span>${tags}</div>${flow?`<div class="flow">${flow}</div>`:""}</article>`}).join("")||'<p class="note">조건에 맞는 문단이 없습니다.</p>';
  $("moreBtn").hidden=list.length<=shown;
}
["fSubj","fYear","fTag"].forEach(id=>$(id).addEventListener("change",()=>{shown=60;renderCases()}));

/* ---------- 패턴 ---------- */
function chart(){
  const W=320,H=150,pl=26,pr=8,pt=8,pb=20,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+i*iw/(YEARS.length-1),y=v=>pt+ih-v/100*ih;
  let g="";[0,25,50,75,100].forEach(v=>{g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`});
  YEARS.forEach((yr,i)=>{g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${String(yr).slice(2)}</text>`});
  const S=[["judge","var(--c1)"],["extend","var(--c2)"],["book","var(--c3)"]];
  for(const [k,c] of S){const pts=TREND[k].map((v,i)=>x(i)+","+y(v)).join(" ");g+=`<polyline points="${pts}" fill="none" style="stroke:${c}" stroke-width="2" stroke-linejoin="round"/>`;const lv=TREND[k][7];g+=`<circle cx="${x(7)}" cy="${y(lv)}" r="3" style="fill:${c}"/>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="연도별 평가어, 확장 연결어, 도서 표기 포함 문단 비율">${g}</svg>`;
}
function rank(arr,alt){const max=arr[0][1];return `<ul class="rank${alt?" alt":""}">`+arr.map(([w,n])=>`<li><span class="w">${w}</span><span class="b" style="width:${Math.round(n/max*60)}%"></span><span class="n">${n}</span></li>`).join("")+"</ul>"}
